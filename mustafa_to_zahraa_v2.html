<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffd5e6">
<title>من مصطفى إلى زهراء 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
:root{--pink:#f45b9e;--deep:#c92d72;--text:#713c58}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;
background:radial-gradient(ellipse at 50% 22%,#fff8fb 0%,#ffe1ed 48%,#ffc9df 100%);
font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--text)}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.float{position:absolute;bottom:-55px;animation:rise var(--dur) linear forwards;opacity:.72}
@keyframes rise{to{transform:translateY(-115svh) rotate(30deg);opacity:0}}
.shell{width:min(100%,480px);padding:16px;position:relative;z-index:1}
.card{position:relative;text-align:center;padding:18px 18px 22px;border-radius:28px;
background:rgba(255,255,255,.72);border:2px solid #fff;box-shadow:0 18px 55px #b84d7d24;
backdrop-filter:blur(7px);min-height:550px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.page{width:100%;animation:pageIn .45s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
h1{font-size:clamp(23px,6vw,30px);line-height:1.65;margin:10px 0;color:var(--deep);font-weight:800}
p{font-size:16px;line-height:2;margin:5px 0 15px}
.art{width:100%;height:245px;border-radius:22px;background:linear-gradient(145deg,#fff0f6,#ffe0ed);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:13px}
.art:before,.art:after{content:"♡";position:absolute;color:#f5a4c7;font-size:35px;opacity:.75}
.art:before{top:13px;left:20px}.art:after{right:20px;bottom:10px}
.mascot{width:min(78%,260px);height:220px;filter:drop-shadow(0 6px 0 #f6bfd5);animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
button{font:800 16px 'Cairo',sans-serif;border:0;border-radius:999px;padding:11px 28px;cursor:pointer;transition:transform .18s,box-shadow .18s;background:var(--pink);color:white;box-shadow:0 6px 16px #f45b9e4a;margin:6px}
button:hover{transform:translateY(-2px);box-shadow:0 9px 20px #f45b9e66}
button:active{transform:scale(.97)}
.secondary{background:white;color:var(--deep);border:1px solid #f5b3ce;box-shadow:none}
.heartTap{font-size:78px;line-height:1;background:transparent;box-shadow:none;padding:0;margin:7px;animation:heartbeat 1s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.sticker{font-size:68px;line-height:1.2;margin:5px 0 10px;animation:bob 2.6s ease-in-out infinite}
.note{background:#fff2f8;border:1px solid #f8c3d9;border-radius:20px;padding:16px 14px;line-height:2.15;font-size:15px;margin:10px 0 13px;color:#8b3d64}
.small{font-size:12px;color:#b47795;margin-top:13px}
.song{width:100%;aspect-ratio:16/9;border:0;border-radius:17px;background:#fce4ef}
.songtitle{font-weight:800;color:#c92d72;font-size:18px;margin:6px 0 3px}
.spark{position:absolute;pointer-events:none;animation:spark .85s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media(max-height:740px){.shell{padding:8px}.card{min-height:calc(100svh - 16px);padding:12px}.art{height:205px}.mascot{height:185px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main class="shell"><section class="card" id="card" aria-live="polite"></section></main>
<script>
const pages=[
 {art:'<div class="sticker">💌🌷</div>',title:'لحظة صغيرة…',text:'قبل لا نبدأ، سؤال بسيط إلكِ 🎀',button:'انتي زهراء؟'},
 {art:'<div class="sticker">🐰🎀</div>',title:'هلو زهوره',text:'يا هلا بأحلى زهوره بالدنيا! 🌸',button:'هلووو'},
 {art:'<div class="sticker">🐻💗</div>',title:'زهراء عندي سؤال الج',text:'بس جاوبيني بصراحة… 🥹',button:'جوااب'},
 {art:'<div class="sticker">🙈💕</div>',title:'بس مستحي أسألج',text:'أخذ نفس وأگولها… 🌷',button:'اسأاال'},
 {art:'<div class="sticker">💞🥺</div>',title:'تحبين مصطفى لو لااا؟',text:'فكري زين قبل الجواب يا زهوره 💗',button:'معليك'},
 {art:'<div class="sticker">🐱💬</div>',title:'شنو معليك,تحبيني لو لا؟',text:'لا تخليني أحتار أكثر 💓',button:'ما ادري'},
 {art:'<div class="sticker">🌸💗🌸</div>',title:'اذا تحبيني دوسي على القلب',text:'هذا القلب إلكِ يا زهوره… 💞',heart:true},
 {art:'<div class="sticker">💖🧸💖</div>',title:'من مصطفى إلى زهراء',note:'والله ما اعرف شنو اكلج يا حبيبة روحي وسندي وامني وحناني ووطني انتي كلشي بالنسبه الي الله يجمعنا بالحلال ان شاء الله ولايحرمني منج ومن ضحكتج ومن شوفتج',button:'احبك صفاوي ❤️'},
 {art:'<div class="sticker">🌹🎶💗</div>',title:'هاي أغنيتج المفضلة يا زهوره',text:'أكثر شخص بالدنيا — راشد الماجد 💗',song:true}
];
let current=0;
const card=document.getElementById('card');
function render(){
 const p=pages[current];
 card.innerHTML=`<div class="page">
   <div class="art">${p.art}</div>
   <h1>${p.title}</h1>
   ${p.text?`<p>${p.text}</p>`:''}
   ${p.note?`<div class="note">${p.note}</div>`:''}
   ${p.heart?'<button class="heartTap" aria-label="القلب" onclick="next()">❤️</button>':''}
   ${p.button?`<button onclick="next()">${p.button}</button>`:''}
   ${p.song?`<div class="songtitle">راشد الماجد — أكثر شخص بالدنيا</div>
   <iframe class="song" src="https://www.youtube-nocookie.com/embed/M4RZ3Z8MFcg?rel=0" title="راشد الماجد - أكثر شخص بالدنيا" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
   <p class="small">إذا ما اشتغل المشغل، <a href="https://www.youtube.com/watch?v=M4RZ3Z8MFcg" target="_blank" rel="noopener">افتحي الأغنية على يوتيوب</a> 🎧</p>`:''}
   <div class="small">مصنوع بكل الحب — مصطفى 💗</div>
 </div>`;
}
function next(){
 if(current<pages.length-1){current++;render();burst();}
}
function burst(){
 const rect=card.getBoundingClientRect();
 for(let i=0;i<18;i++){
  const s=document.createElement('span');s.className='spark';s.textContent=['💗','💕','✨','🌸'][i%4];
  s.style.left=(30+Math.random()*40)+'%';s.style.top='55%';
  s.style.setProperty('--x',(Math.random()*230-115)+'px');s.style.setProperty('--y',(Math.random()*-180-10)+'px');
  card.appendChild(s);setTimeout(()=>s.remove(),900);
 }
}
const bg=document.getElementById('bg');
function floatHeart(){
 const el=document.createElement('span');el.className='float';
 el.textContent=['💗','💕','💖','♡','🌸'][Math.floor(Math.random()*5)];
 el.style.left=Math.random()*100+'%';el.style.fontSize=(15+Math.random()*22)+'px';
 el.style.setProperty('--dur',(5+Math.random()*5)+'s');
 bg.appendChild(el);setTimeout(()=>el.remove(),10500);
}
setInterval(floatHeart,450);
render();
</script>
</body>
</html>
